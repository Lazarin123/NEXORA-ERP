 if(id==='stocktake-items-search'){stocktakeSearch=target.value;const pos=target.selectionStart;renderApp();const next=$('#stocktake-items-search');if(next){next.focus();next.setSelectionRange(pos,pos);}return;}
 if(id==='partner-search'){partnerSearch=target.value;const pos=target.selectionStart;renderApp();const next=$('#partner-search');if(next){next.focus();next.setSelectionRange(pos,pos);}return;}
 if(id==='collaborator-search'){collaboratorSearch=target.value;const pos=target.selectionStart;renderApp();const next=$('#collaborator-search');if(next){next.focus();next.setSelectionRange(pos,pos);}return;}
 if(id==='finance-search'){financeSearch=target.value;const pos=target.selectionStart;renderApp();const next=$('#finance-search');if(next){next.focus();next.setSelectionRange(pos,pos);}return;}
 if(id==='global-search'){globalSearch=target.value;return;}
 if(id==='note-search'){renderApp();const next=$('#note-search');if(next){next.focus();next.setSelectionRange(next.value.length,next.value.length);}return;}
 if(id==='audit-search'){const pos=target.selectionStart;renderApp();const next=$('#audit-search');if(next){next.focus();next.setSelectionRange(pos,pos);}return;}
 if(id==='setting-brand-name'||id==='setting-tagline')updateBrandPreview();
});
document.addEventListener('keydown',event=>{
 if(currentPage==='sales'&&posTab==='checkout'&&!$('#modal-root').innerHTML){if(event.key==='F2'){event.preventDefault();focusPosScanner();return;}if(event.key==='F4'){event.preventDefault();posCheckoutForm();return;}if(event.ctrlKey&&event.key==='Backspace'){event.preventDefault();clearPosCart(true);return;}if(event.key==='Escape'&&event.target.id==='pos-barcode-input'){event.preventDefault();focusPosScanner();return;}}
 if(currentPage==='stockin'&&stockInTab==='receive'&&!$('#modal-root').innerHTML&&event.key==='F2'){event.preventDefault();focusStockInScanner();return;}
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('#global-search')?.focus();}
 if(event.key==='Escape'&&$('#modal-root').innerHTML){if($('#product-form')){event.preventDefault();toast('Use o botão Fechar no formulário de produto.','info');}else closeDialog();}
 if(event.key==='Enter'&&event.target.id==='global-search'){event.preventDefault();showGlobalSearch(event.target.value);}
});

/* Inicialização resiliente: nenhuma falha no armazenamento deve deixar a página em branco. */
let startupWatchdog=null;
function showStartupFallback(reason='O armazenamento demorou para responder.'){
 if(initialized)return;
 const base=seedState();
 if(!state||typeof state!=='object')state=base;
 state.meta={...base.meta,...(state.meta||{})};
 state.settings={...base.settings,...(state.settings||{})};
 state.preferences={...base.preferences,...(state.preferences||{})};
 for(const key of ['authUsers','audit','activities','accounts','notes','sales','posDraft','movements','statements','reconciliations','products','partners','titles','importHistory','alerts','assets','assetCategories','assetSectors','assetMovements','wmsLocations','wmsAllocations','wmsMovements'])if(!Array.isArray(state[key]))state[key]=Array.isArray(base[key])?base[key]:[];
 if(state.meta?.cleanInstall!==true&&!state.authUsers.some(user=>user.email===CONFIG.demoEmail.toLowerCase()))state.authUsers.push({id:'user_demo',name:'Carlos Martins',email:CONFIG.demoEmail.toLowerCase(),passwordHash:null,passwordPlainDemo:CONFIG.demoPassword,role:'Administrador',companyId:state.meta.companyId||'company_demo',createdAt:new Date().toISOString()});
 if(!Array.isArray(state.alertDismissals))state.alertDismissals=[];if(!Array.isArray(state.alertReadIds))state.alertReadIds=[];
 posCart=Array.isArray(state.posDraft)?state.posDraft.map(line=>({...line})):[];
 try{updateIdentity();renderApp();initialized=true;toast(`${reason} O Nexora abriu em modo local; exporte um backup e confira o armazenamento antes de usar dados reais.`,'info');}
 catch(error){console.error(error);const app=$('#app');if(app)app.innerHTML=`<div style="padding:30px;max-width:760px;margin:8vh auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;font-family:system-ui,sans-serif"><h1>O Nexora iniciou em modo de recuperação</h1><p>${escapeHTML(error.message||error)}</p><p>Feche outras abas do Nexora, abra novamente pelo inicializador e, se necessário, use o botão abaixo para recarregar.</p><button class="btn btn-primary" onclick="location.reload()">Recarregar</button></div>`;}
}
startupWatchdog=setTimeout(()=>{if(!initialized)showStartupFallback('A inicialização excedeu o tempo previsto.');},4500);
(async function init(){
 try{
  await ensureSeed();
  updateIdentity();renderApp();initialized=true;
  if(startupWatchdog)clearTimeout(startupWatchdog);
 }catch(error){
  console.error('Falha na inicialização do Nexora ERP:',error);
  showStartupFallback(`O armazenamento local não respondeu (${error.message||'erro desconhecido'}).`);
  initialized=true;if(startupWatchdog)clearTimeout(startupWatchdog);
 }
})();
</script>
