function openDatabase(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){resolve(null);return;}
  let settled=false;
  const finish=(callback,value)=>{if(settled)return;settled=true;clearTimeout(timer);callback(value);};
  const timer=setTimeout(()=>finish(resolve,null),1400);
  let request;
  try{request=indexedDB.open(DB_NAME,DB_VERSION);}catch(error){finish(resolve,null);return;}
  request.onupgradeneeded=()=>{try{const database=request.result;if(!database.objectStoreNames.contains('state'))database.createObjectStore('state',{keyPath:'id'});}catch(error){console.warn('Não foi possível preparar o armazenamento local.',error);}};
  request.onsuccess=()=>{const database=request.result;if(settled){try{database.close();}catch(_){}return;}finish(resolve,database);};
  request.onerror=()=>finish(reject,request.error||new Error('Falha ao abrir o banco local.'));
  request.onblocked=()=>finish(resolve,null);
 });
}

function pageHeading(eyebrow,title,description,actions=''){return `<div class="page-header"><div><div class="eyebrow">${escapeHTML(eyebrow)}</div><h1>${title}</h1><p>${description}</p></div><div class="page-actions">${actions}</div></div>`;}
function statCard(label,value,foot,ico,tone='') {return `<div class="card stat-card"><div class="stat-top"><span>${label}</span><span class="stat-icon ${tone}">${icon(ico,18)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`;}
function renderPage(){const storageWarning=volatileMode?'<div class="notice warning mb-16">O navegador bloqueou o armazenamento persistente neste modo de abertura. Os dados podem se perder ao fechar a página; abra por http://localhost (instruções no README) ou exporte um backup JSON.</div>':'';let content='';switch(currentPage){case'dashboard':content=renderDashboard();break;case'inventory':content=renderInventory();break;case'wms':content=renderWMS();break;case'stocktake':content=renderStocktake();break;case'labels':content=renderLabels();break;case'assets':content=renderAssets();break;case'stockin':currentPage='notes';content=renderNotes();break;case'partners':content=renderPartners();break;case'notes':content=renderNotes();break;case'finance':content=renderFinance();break;case'reports':content=renderReports();break;case'audit':content=renderAudit();break;case'sales':content=renderSales();break;case'users':content=renderCollaborators();break;case'profile':content=renderMyProfile();break;case'adminbase':content=isAdministrator()?renderAdminBase():renderDashboard();break;default:content=renderDashboard();}return storageWarning+content;}
function renderDashboard(){

 const low=state.products.filter(p=>p.active!==false&&Number(p.quantity)<=Number(p.min));const recent=state.activities.slice(0,5);const canViewFinance=hasPermission('finance','view');

 <div class="dashboard-grid">${canViewFinance?`<div class="card"><div class="card-head"><div><h3>Fluxo financeiro</h3><p>Comparativo ilustrativo de receitas e despesas por período</p></div><span class="badge badge-info">Visão local</span></div><div class="chart-wrap">${renderFinanceChart(Number(state.preferences.period)||30)}</div><div class="card-divider"></div><div class="card-body"><div class="legend"><span class="legend-item"><i class="legend-dot" style="background:#2563eb"></i>Receitas recebidas</span><span class="legend-item"><i class="legend-dot" style="background:#10b981"></i>Despesas pagas</span></div></div></div>`:''}
 <div class="card"><div class="card-head"><div><h3>Dicas e alertas</h3><p>Itens que merecem atenção</p></div><button class="btn btn-quiet btn-sm" data-page="inventory">Ver estoque</button></div><div class="card-body">${low.slice(0,4).map(p=>`<div class="alert-row"><span class="alert-mark" style="background:${Number(p.quantity)===0?'#ef4444':'#f59e0b'}"></span><div class="alert-copy"><strong>${escapeHTML(p.name)}</strong><p>${Number(p.quantity)===0?'Sem estoque':`Saldo ${formatQuantity(p.quantity)} ${escapeHTML(p.unit)} · mínimo ${formatQuantity(p.min)}`}</p></div>${statusBadge(stockStatus(p))}</div>`).join('')||'<div class="empty-state">'+icon('check',28)+'<strong>Nenhum alerta de estoque</strong><span>Os níveis estão acima do mínimo.</span></div>'}<div class="separator"></div><div class="flex items-center between"><div><span class="small muted">Títulos vencidos</span><div class="stat-value" style="font-size:21px;margin:5px 0">${state.titles.filter(t=>titleStatus(t)==='Vencido').length}</div></div><button class="btn btn-sm" data-page="finance">Revisar financeiro ${icon('arrow',13)}</button></div></div></div></div>

function renderFinanceChart(periodDays){
 const range=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i)*Math.max(1,Math.round(periodDays/7)));return d;});
 const totals=range.map((d,i)=>{const day=dateISO(d);const income=state.titles.filter(t=>t.type==='receber'&&t.status!=='Cancelado'&&t.payments?.some(p=>p.date===day&&!p.reversedAt)).reduce((s,t)=>s+t.payments.filter(p=>p.date===day&&!p.reversedAt).reduce((a,p)=>a+(p.amount||0),0),0);const expenses=state.titles.filter(t=>t.type==='pagar'&&t.status!=='Cancelado'&&t.payments?.some(p=>p.date===day&&!p.reversedAt)).reduce((s,t)=>s+t.payments.filter(p=>p.date===day&&!p.reversedAt).reduce((a,p)=>a+(p.amount||0),0),0);return{day,label:new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit'}).format(d),income,expenses};});
 const max=Math.max(1,...totals.flatMap(d=>[d.income,d.expenses]));const W=620,H=210,left=38,right=12,top=10,bottom=28,plotW=W-left-right,plotH=H-top-bottom;
 let grid='';for(let i=0;i<4;i++){const y=top+i*plotH/3;grid+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#e9eef5" stroke-dasharray="3 4"/>`;}
 const pts=(key)=>totals.map((d,i)=>`${left+i*plotW/(totals.length-1)},${top+plotH-(d[key]/max)*plotH}`).join(' ');
 const circles=key=>totals.map((d,i)=>`<circle cx="${left+i*plotW/(totals.length-1)}" cy="${top+plotH-(d[key]/max)*plotH}" r="3" fill="${key==='income'?'#2563eb':'#10b981'}"/>`).join('');
 const labels=totals.map((d,i)=>`<text x="${left+i*plotW/(totals.length-1)}" y="${H-7}" fill="#94a3b8" text-anchor="middle" font-size="10">${d.label}</text>`).join('');
 return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas recebidas no período">${grid}<polyline points="${pts('income')}" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts('expenses')}" fill="none" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>${circles('income')}${circles('expenses')}${labels}</svg>`;
}
function renderInventory(){
 const allProducts=state.products;const active=allProducts.filter(p=>p.active!==false);const visibleProducts=allProducts.filter(p=>activityFilter==='all'||(activityFilter==='inactive'?p.active===false:p.active!==false));const filtered=visibleProducts.filter(p=>{const term=inventorySearch.toLowerCase();const status=p.active===false?'Inativo':stockStatus(p);return(!term||`${p.id||''} ${p.name} ${p.sku} ${p.ean||''} ${p.lot||''}`.toLowerCase().includes(term))&&($('#stock-status-filter')?.value==='all'||!$('#stock-status-filter')?.value||status===$('#stock-status-filter').value)&&(!$('#stock-category-filter')?.value||$('#stock-category-filter').value==='all'||p.category===$('#stock-category-filter').value);});
 const categories=[...new Set(active.map(p=>p.category).filter(Boolean))].sort();
 return `${pageHeading('OPERAÇÃO','Produtos','Cadastro, identificação, validade, lotes, imagens e saldo por movimentação.',`<button class="btn" data-action="stock-import">${icon('upload',15)} Importar CSV/XML</button><button class="btn" data-action="stock-export">${icon('download',15)} Exportar</button><button class="btn btn-primary" data-action="product-new">${icon('plus',16)} Novo produto</button>`)}
 <div class="grid grid-4 mb-16">${statCard('Produtos ativos',String(active.length),'Itens cadastrados','box')}${statCard('Valor em estoque',money(stockValue()),'Quantidade × custo médio','wallet','green')}${statCard('Estoque baixo',String(active.filter(p=>stockStatus(p)==='Baixo').length),'No nível mínimo ou abaixo','alert','amber')}${statCard('Sem estoque',String(active.filter(p=>stockStatus(p)==='Esgotado').length),'Necessita reposição','package','rose')}</div>
 <div class="card"><div class="toolbar"><input id="stock-search" placeholder="Buscar por ID, nome, SKU, lote ou código de barras" value="${escapeHTML(inventorySearch)}"> <select id="stock-activity-filter"><option value="active" ${activityFilter==='active'?'selected':''}>Produtos ativos</option><option value="inactive" ${activityFilter==='inactive'?'selected':''}>Inativos</option><option value="all" ${activityFilter==='all'?'selected':''}>Todos os produtos</option></select><select id="stock-category-filter"><option value="all">Todas as categorias</option>${categories.map(c=>`<option value="${escapeHTML(c)}" ${$('#stock-category-filter')?.value===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select><select id="stock-status-filter"><option value="all">Todos os status</option><option value="Em estoque" ${$('#stock-status-filter')?.value==='Em estoque'?'selected':''}>Em estoque</option><option value="Baixo" ${$('#stock-status-filter')?.value==='Baixo'?'selected':''}>Estoque baixo</option><option value="Esgotado" ${$('#stock-status-filter')?.value==='Esgotado'?'selected':''}>Esgotado</option><option value="Inativo" ${$('#stock-status-filter')?.value==='Inativo'?'selected':''}>Inativo</option></select><span class="spacer"></span><div class="segmented"><button data-action="stock-view" data-view="list" class="${inventoryView==='list'?'active':''}">${icon('file',14)} Lista</button><button data-action="stock-view" data-view="grid" class="${inventoryView==='grid'?'active':''}">${icon('dashboard',14)} Grade</button></div></div>${inventoryView==='list'?renderProductsTable(filtered):renderProductsGrid(filtered)}<div class="pagination"><span>Exibindo ${filtered.length} de ${visibleProducts.length} produtos</span><span>Estoque é calculado por movimentos; não edite a quantidade diretamente.</span></div></div>
 <div class="notice mt-16">Regra aplicada: entradas recalculam o custo médio ponderado; saídas e perdas registram movimentos com motivo. Estoque negativo fica bloqueado por padrão.</div>`;
}

 return `<div class="table-wrap"><table class="data-table"><thead><tr><th>ID (somente leitura)</th><th>Produto</th><th>Lote</th><th>Validade</th><th>Categoria</th><th>Saldo</th><th>Endereços WMS</th><th>Custo médio</th><th>Preço venda</th><th>Status</th><th></th></tr></thead><tbody>${products.map(p=>{const max=Math.max(Number(p.ideal)||0,Number(p.quantity)||0,1);const expired=p.expiryDate&&p.expiryDate<dateISO();return `<tr><td><span class="product-id-chip" title="${escapeHTML(p.id)}">${escapeHTML(p.id||'—')}</span></td><td><div class="product-main"><div class="product-list-image">${p.imageData?`<img src="${escapeHTML(p.imageData)}" alt="">`:icon('package',18)}</div><div><div class="table-primary">${escapeHTML(p.name)}</div><div class="table-secondary">SKU ${escapeHTML(p.sku)}${p.ean?` · EAN ${escapeHTML(p.ean)}`:''}</div></div></div></td><td>${escapeHTML(p.lot||'—')}</td><td>${p.expiryDate?`${fmtDate(p.expiryDate)} ${expired?'<span class="badge badge-danger">Vencido</span>':''}`:'—'}</td><td>${escapeHTML(p.category||'—')}</td><td><div class="qty-cell"><strong>${formatQuantity(p.quantity)} ${escapeHTML(p.unit||'UN')}</strong><div class="progress"><span style="width:${Math.min(100,Number(p.quantity)/max*100)}%;background:${stockStatus(p)==='Esgotado'?'#ef4444':stockStatus(p)==='Baixo'?'#f59e0b':'#2563eb'}"></span></div></div></td><td><div>${wmsProductLocationChips(p.id)}</div><button class="btn btn-quiet btn-sm mt-8" data-action="product-wms" data-id="${p.id}">Ver no WMS</button></td><td class="amount">${money(p.cost)}</td><td class="amount">${money(p.price)}</td><td>${getInventoryLock('product',p.id)?'<span class="stocktake-lock-pill">Pausado no inventário</span>':statusBadge(expired?'Vencido':p.active===false?'Inativo':stockStatus(p))}</td><td><div class="row-actions"><button class="icon-action" data-action="product-view" data-id="${p.id}" title="Ver detalhes">${icon('eye',15)}</button><button class="icon-action" data-action="product-edit" data-id="${p.id}" title=" /* ===== WMS / ARMAZÉM ===== */
function wmsLocation(id){return (state.wmsLocations||[]).find(l=>l.id===id);}
function wmsLocationLabel(id){const l=wmsLocation(id);return l?`${l.code} · ${l.name}`:'Sem endereço';}
function wmsProductAllocations(productId){return (state.wmsAllocations||[]).filter(a=>a.productId===productId&&Number(a.quantity)>0);}
function wmsAssignedQty(productId){return wmsProductAllocations(productId).reduce((s,a)=>s+Number(a.quantity||0),0);}
function wmsUnlocatedQty(productId){const p=getProduct(productId);return Math.max(0,Math.round(((Number(p?.quantity)||0)-wmsAssignedQty(productId))*1000)/1000);}
function wmsLocationQty(locationId,exceptProduct=''){return (state.wmsAllocations||[]).filter(a=>a.locationId===locationId&&a.productId!==exceptProduct).reduce((s,a)=>s+Number(a.quantity||0),0);}
function wmsLocationProductCount(locationId){return new Set((state.wmsAllocations||[]).filter(a=>a.locationId===locationId&&Number(a.quantity)>0).map(a=>a.productId)).size;}
function wmsProductLocationChips(productId){const allocations=wmsProductAllocations(productId);if(!allocations.length)return '<span class="badge badge-warning">Sem endereço</span>';return allocations.slice(0,3).map(a=>`<span class="wms-location-chip" title="${escapeHTML(wmsLocationLabel(a.locationId))}">${escapeHTML(wmsLocation(a.locationId)?.code||'Posição')} <b>${formatQuantity(a.quantity)}</b></span>`).join(' ')+(allocations.length>3?` <span class="tiny muted">+${allocations.length-3}</span>`:'');}
function wmsRecordMovement(productId,fromId,toId,quantity,type,reason='') {const p=getProduct(productId);const m={id:uid('wmsmov'),productId,productName:p?.name||'',sku:p?.sku||'',fromLocationId:fromId||'',toLocationId:toId||'',from:fromId?wmsLocationLabel(fromId):'Sem endereço',to:toId?wmsLocationLabel(toId):'Sem endereço',quantity:Math.round((Number(quantity)||0)*1000)/1000,type,reason,userName:getUser().name,userId:getUser().id,date:new Date().toISOString()};state.wmsMovements.unshift(m);if(state.wmsMovements.length>3000)state.wmsMovements.length=3000;return m;}
function wmsUpsertAllocation(productId,locationId,delta){let a=(state.wmsAllocations||[]).find(x=>x.productId===productId&&x.locationId===locationId);if(!a){a={id:uid('walloc'),productId,locationId,quantity:0,updatedAt:new Date().toISOString()};state.wmsAllocations.push(a);}a.quantity=Math.round((Number(a.quantity||0)+Number(delta||0))*1000)/1000;a.updatedAt=new Date().toISOString();if(a.quantity<=0.0001)state.wmsAllocations=state.wmsAllocations.filter(x=>x.id!==a.id);return a;}
function wmsConsumeAllocatedStock(productId,qty,reason,origin){let remaining=Number(qty)||0;const unlocatedBefore=wmsUnlocatedQty(productId);const fromUnlocated=Math.min(remaining,unlocatedBefore);if(fromUnlocated>0){wmsRecordMovement(productId,'','',fromUnlocated,'SAÍDA DE SALDO SEM ENDEREÇO',reason||origin||'Saída de estoque');remaining-=fromUnlocated;}const allocations=wmsProductAllocations(productId).sort((a,b)=>String(a.updatedAt||'').localeCompare(String(b.updatedAt||'')));for(const a of allocations){if(remaining<=0)break;const take=Math.min(Number(a.quantity)||0,remaining);if(take>0){wmsUpsertAllocation(productId,a.locationId,-take);wmsRecordMovement(productId,a.locationId,'',take,origin==='Venda'?'SEPARAÇÃO / SAÍDA':'SAÍDA DE ENDEREÇO',reason||origin||'Saída de estoque');remaining-=take;}}}
function wmsRegisterReceipt(productId,qty,reason){wmsRecordMovement(productId,'','',qty,'RECEBIMENTO SEM ENDEREÇO',reason||'Nota confirmada; endereçar no WMS');}
function wmsCapacityFree(locationId){const loc=wmsLocation(locationId);if(!loc)return 0;return Math.max(0,(Number(loc.capacity)||0)-wmsLocationQty(locationId));}
function renderWMS(){

/* ===== GESTÃO: INVENTÁRIO ROTATIVO / GERAL ===== */
function inventorySessionById(id){return (state.inventorySessions||[]).find(x=>x.id===id);}
function inventorySessionItem(sessionId,itemId){const session=inventorySessionById(sessionId);return session?.items?.find(x=>x.id===itemId);}
function inventorySessionStatusLabel(item){if(item.status==='Contando'||item.status==='Contado')return 'Pausado no cadastro';if(item.status==='Finalizado')return 'Finalizado';return item.status||'Pendente';}
function stocktakeCreateForm(mode='Rotativo'){
 const productCategories=[...new Set(state.products.filter(p=>p.active!==false).map(p=>p.category).filter(Boolean))].sort();
 const scopes=[{value:'Tudo',label:'Tudo: Produtos + Ativos'},{value:'Produtos',label:'Somente Produtos / Estoque'},{value:'Ativos',label:'Somente Ativos / Máquinas'}];
 openDialog(mode==='Geral'?'Iniciar inventário geral':'Iniciar inventário rotativo',mode==='Geral'?'Abrange todos os produtos ativos e ativos patrimoniais ativos.':'Selecione o escopo de uma contagem cíclica, por categoria ou setor.',`<form id="stocktake-create-form"><div class="form-grid">${field('Tipo de inventário *','mode',mode,'select',{options:[{value:'Rotativo',label:'Rotativo'},{value:'Geral',label:'Geral'}]})}${field('Abrangência *','scope',mode==='Geral'?'Tudo':'Produtos','select',{options:scopes})}${field('Nome / referência *','name',mode==='Geral'?`Inventário geral ${fmtDate(dateISO())}`:`Inventário rotativo ${fmtDate(dateISO())}`,'text',{full:true,placeholder:'Ex.: Contagem mensal do estoque'})}${field('Categoria de produto','category','all','select',{required:false,options:[{value:'all',label:'Todas as categorias'},...productCategories.map(v=>({value:v,label:v}))]})}${field('Setor dos ativos','sector','all','select',{required:false,options:[{value:'all',label:'Todos os setores'},...(state.assetSectors||[]).map(v=>({value:v,label:v}))]})}</div><div class="notice mt-16">O inventário cria uma fotografia inicial dos itens selecionados. Um item fica pausado somente quando a contagem é aberta; não será possível vender, receber, movimentar no WMS ou editar esse item até finalizar sua operação.</div></form>`,`<button class="btn" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="stocktake-create">${icon('clipboardList',15)} Criar inventário</button>`,true);

async function createStocktake(){
 const form=$('#stocktake-create-form');if(!form)return;const d=formObject(form);if(!String(d.name||'').trim()){toast('Informe um nome para o inventário.','error');return;}
 const mode=d.mode==='Geral'?'Geral':'Rotativo',scope=mode==='Geral'?'Tudo':(d.scope||'Produtos');
 const products=scope==='Ativos'?[]:state.products.filter(p=>p.active!==false&&(d.category==='all'||!d.category||p.category===d.category)&&!getInventoryLock('product',p.id));
 const assets=scope==='Produtos'?[]:(state.assets||[]).filter(a=>a.active!==false&&a.status!=='Baixado'&&(d.sector==='all'||!d.sector||a.sector===d.sector)&&!getInventoryLock('asset',a.id));
 const items=[...products.map(p=>({id:uid('sti'),entityType:'product',refId:p.id,code:p.sku||p.id,sku:p.sku||'',ean:p.ean||'',name:p.name,category:p.category||'Sem categoria',unit:p.unit||'UN',expectedLot:p.lot||'',expectedExpiry:p.expiryDate||'',observedLot:'',observedExpiry:'',expectedQuantity:null,countedQuantity:null,expectedCost:null,expectedWmsLocations:[],status:'Pendente',notes:'',createdAt:new Date().toISOString()})),...assets.map(a=>({id:uid('sti'),entityType:'asset',refId:a.id,code:a.code||a.id,name:a.name,category:a.category||'Sem categoria',serial:a.serial||'',expectedStatus:'',expectedCondition:'',expectedSector:'',expectedLocation:'',expectedAssignee:'',found:null,observedCondition:'',observedSector:'',observedLocation:'',observedAssignee:'',status:'Pendente',notes:'',createdAt:new Date().toISOString()}))];
 if(!items.length){toast('Não há itens disponíveis para este escopo. Verifique filtros ou contagens abertas.','warning');return;}
 const now=new Date().toISOString();const num=`INV-${dateISO().replaceAll('-','')}-${String((state.inventorySessions||[]).length+1).padStart(3,'0')}`;const session={id:uid('stocktake'),number:num,name:String(d.name).trim(),mode,scope,category:d.category||'all',sector:d.sector||'all',status:'Aberto',items,createdAt:now,createdBy:getUser().id,createdByName:getUser().name,completedAt:null};state.inventorySessions=state.inventorySessions||[];state.inventorySessions.unshift(session);stocktakeCurrentSessionId=session.id;stocktakeSearch='';logAudit('inventario',session.id,'criar',null,{number:session.number,mode,scope,itemCount:items.length},'Abertura de inventário');addActivity('stocktake','Inventário criado',`${session.number} · ${items.length} itens`);closeDialog();await persist();renderApp();toast(`Inventário ${session.number} criado com ${items.length} itens.`, 'success');
}
function stocktakeStartItem(sessionId,itemId){
 const session=inventorySessionById(sessionId),item=inventorySessionItem(sessionId,itemId);if(!session||session.status!=='Aberto'||!item)return;if(item.status==='Finalizado'){toast('Este item já foi finalizado.','info');return;}
 const activeLock=getInventoryLock(item.entityType,item.refId);if(activeLock&&(activeLock.session.id!==session.id||activeLock.item.id!==item.id)){toast(`Este item já está pausado pelo inventário ${activeLock.session.number}. Finalize essa contagem antes de abrir outra.`, 'error');return;}
 if(item.status==='Pendente'){
  if(item.entityType==='product'){const p=getProduct(item.refId);if(!p){toast('Produto não encontrado; atualize o inventário.','error');return;}item.expectedQuantity=Number(p.quantity)||0;item.expectedCost=Number(p.cost)||0;item.name=p.name;item.code=p.sku||p.id;item.sku=p.sku||'';item.ean=p.ean||'';item.category=p.category||'Sem categoria';item.unit=p.unit||'UN';item.expectedLot=p.lot||'';item.expectedExpiry=p.expiryDate||'';item.expectedWmsLocations=wmsProductAllocations(p.id).map(a=>({locationId:a.locationId,code:wmsLocation(a.locationId)?.code||'',name:wmsLocation(a.locationId)?.name||'',quantity:Number(a.quantity)||0}));}
  else{const a=(state.assets||[]).find(x=>x.id===item.refId);if(!a){toast('Ativo não encontrado; atualize o inventário.','error');return;}item.expectedStatus=a.status||'Em estoque';item.expectedCondition=a.condition||'Bom';item.expectedSector=a.sector||'';item.expectedLocation=a.location||'';item.expectedAssignee=a.assignee||'';item.name=a.name;item.code=a.code||a.id;item.category=a.category||'Sem categoria';item.serial=a.serial||'';}
  item.status='Contando';item.startedAt=new Date().toISOString();item.startedBy=getUser().id;logAudit('inventario_item',item.id,'iniciar contagem',null,{entityType:item.entityType,refId:item.refId},`Item bloqueado durante inventário ${session.number}`);persist().catch(err=>console.error('Falha ao persistir início da contagem',err));
 }
 stocktakeCountForm(sessionId,itemId);
}

async function stocktakeSaveCount(sessionId,itemId){
 const session=inventorySessionById(sessionId),item=inventorySessionItem(sessionId,itemId),form=$('#stocktake-count-form');if(!session||!item||!form)return;const d=formObject(form);const before={status:item.status,entityType:item.entityType,countRegistered:item.countedQuantity!=null};
 if(item.entityType==='product'){
  const raw=String(d.countedQuantity??'').trim();const qty=raw===''?NaN:Number(raw);if(!Number.isFinite(qty)||qty<0){toast('Informe uma quantidade física igual ou maior que zero.','error');return;}item.countedQuantity=Math.round(qty*1000)/1000;item.observedLot=String(d.observedLot||'').trim();item.observedExpiry=d.observedExpiry||'';delete item.difference;
 }else{
  if(!['sim','nao'].includes(d.found)){toast('Informe se o ativo foi localizado.','error');return;}item.found=d.found==='sim';item.observedCondition=d.observedCondition||'';item.observedSector=String(d.observedSector||'').trim();item.observedLocation=String(d.observedLocation||'').trim();item.observedAssignee=String(d.observedAssignee||'').trim();
 }
 item.notes=String(d.notes||'').trim();item.status='Contado';item.countedAt=new Date().toISOString();item.countedBy=getUser().id;logAudit('inventario_item',item.id,'salvar contagem',before,{entityType:item.entityType,countRegistered:true,status:item.status},`Inventário ${session.number}; valores comparativos reservados ao relatório final`);closeDialog();await persist();renderApp();toast('Contagem salva. A quantidade atual e a divergência não são exibidas durante a operação.','success');
}
function stocktakeFinalizePrompt(sessionId,itemId){
 const session=inventorySessionById(sessionId),item=inventorySessionItem(sessionId,itemId);if(!session||!item||item.status!=='Contado'){toast('Salve a contagem antes de finalizar.','warning');return;}
 let details='';if(item.entityType==='product'){details=`<div class="notice success"><strong>Contagem física registrada</strong><br>${escapeHTML(item.name)} · SKU ${escapeHTML(item.sku||item.code)}<br>Lote conferido: ${escapeHTML(item.observedLot||item.expectedLot||'Não informado')} · Validade: ${item.observedExpiry?fmtDate(item.observedExpiry):item.expectedExpiry?fmtDate(item.expectedExpiry):'Não informada'}</div><p>Ao confirmar, o sistema fará a reconciliação internamente, registrará o ajuste auditado e liberará o produto. A quantidade atual e a divergência serão mostradas somente no relatório final, após o encerramento do inventário.</p>`;}else{details=`<div class="notice ${item.found?'success':'warning'}"><strong>${item.found?'Conferência patrimonial registrada':'Ativo não localizado'}</strong><br>${escapeHTML(item.category||'Sem categoria')} · ${escapeHTML(item.code)} · ${escapeHTML(item.name)}<br>Setor observado: ${escapeHTML(item.observedSector||'Não informado')} · Local: ${escapeHTML(item.observedLocation||'Não informado')}<br>Condição: ${escapeHTML(item.observedCondition||'Não informada')}</div><p>O resultado comparativo será apresentado somente no relatório final. Ao confirmar, o ativo será liberado para edição e transferência.</p>`;}
 openDialog('Finalizar item do inventário',`${session.number} · ${item.code} · ${item.name}`,details,`<button class="btn" data-action="modal-close">Voltar</button><button class="btn btn-primary" data-action="stocktake-finalize-confirm" data-session="${session.id}" data-item="${item.id}">${icon('check',14)} Confirmar e liberar item</button>`,true);
}
async function stocktakeFinalizeItem(sessionId,itemId){
 const session=inventorySessionById(sessionId),item=inventorySessionItem(sessionId,itemId);if(!session||session.status!=='Aberto'||!item||item.status!=='Contado'){toast('Item não está pronto para finalização.','error');return;}
 if(item.entityType==='product'){
  const p=getProduct(item.refId);if(!p){toast('Produto vinculado não foi encontrado.','error');return;}const expectedAtCount=Math.round((Number(item.expectedQuantity)||0)*1000)/1000;const liveQuantity=Math.round((Number(p.quantity)||0)*1000)/1000;if(Math.abs(liveQuantity-expectedAtCount)>0.0001){item.expectedQuantity=liveQuantity;item.difference=Math.round((Number(item.countedQuantity)-liveQuantity)*1000)/1000;item.status='Contado';item.countedAt=new Date().toISOString();await persist();renderApp();toast('O registro foi alterado durante a operação. Revise e salve novamente a contagem física antes de finalizar.','warning');return;}const diff=Math.round((Number(item.countedQuantity)-expectedAtCount)*1000)/1000;
  if(Math.abs(diff)>0.0001){recordMovement(p,diff>0?'AJUSTE_POSITIVO':'AJUSTE_NEGATIVO',Math.abs(diff),Number(p.cost)||0,`Reconciliação do inventário ${session.number}: ${item.notes||'contagem física'}`,'Fechamento de inventário');}
  if(item.observedLot)p.lot=item.observedLot;if(item.observedExpiry)p.expiryDate=item.observedExpiry;
  item.difference=diff;item.finalQuantity=Number(p.quantity)||0;
 }else{
  const a=(state.assets||[]).find(x=>x.id===item.refId);if(!a){toast('Ativo vinculado não foi encontrado.','error');return;}const before=clone(a);a.lastInventoryAt=new Date().toISOString();a.inventoryCheckStatus=item.found?'Localizado':'Não localizado';a.inventoryCheckSession=session.number;a.inventoryCheckNotes=item.notes||'';
  if(item.found){a.condition=item.observedCondition||a.condition;if(item.observedSector)a.sector=item.observedSector;if(item.observedLocation)a.location=item.observedLocation;if(item.observedAssignee)a.assignee=item.observedAssignee;}

function code39Svg(raw){const source=String(raw||'ITEM').toUpperCase();const encoded=source.replace(/[^0-9A-Z .\-$\/+%]/g,'-').slice(0,42)||'ITEM';const value=`*${encoded}*`;let x=8;const rects=[];for(let c=0;c<value.length;c++){const pattern=CODE39_PATTERNS[value[c]]||CODE39_PATTERNS['-'];for(let j=0;j<pattern.length;j++){const width=pattern[j]==='w'?3:1;if(j%2===0)rects.push(`<rect x="${x}" y="2" width="${width}" height="34"/>`);x+=width;}x+=1;}const width=x+8;return `<svg class="label-barcode" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} 40" role="img" aria-label="Código de barras Code 39 ${escapeHTML(encoded)}" preserveAspectRatio="none"><rect width="${width}" height="40" fill="#fff"/><g fill="#111">${rects.join('')}</g></svg><div class="label-barcode-caption">${escapeHTML(encoded)} · CODE 39</div>`;}

function wmsAddressForm(productId){const p=getProduct(productId);if(!p)return;if(getInventoryLock('product',p.id)){toast('Produto pausado por contagem ativa no módulo Inventário.','error');return;}const unlocated=wmsUnlocatedQty(p.id);if(unlocated<=0){toast('Este produto não tem saldo sem endereço.','info');return;}const opts=(state.wmsLocations||[]).filter(l=>l.active!==false).map(l=>({value:l.id,label:`${l.code} · ${l.name} (livre: ${formatQuantity(wmsCapacityFree(l.id))})`}));openDialog('Endereçar produto',`${p.sku} · ${p.name} · sem endereço: ${formatQuantity(unlocated)} ${p.unit||'UN'}`,`<form id="wms-address-form" data-id="${p.id}"><div class="form-grid">${field('Posição de destino *','locationId',opts[0]?.value||'','select',{options:opts,full:true})}${field('Quantidade *','quantity',String(unlocated),'number',{min:'0.001',max:String(unlocated),step:'0.001'})}${field('Referência / motivo','reason','Endereçamento após recebimento','text',{required:false,full:true})}</div><p class="small muted mt-8">O sistema valida saldo sem endereço e capacidade da posição.</p></form>`,`<button class="btn" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="wms-address-save" data-id="${p.id}">Confirmar endereço</button>`);}
async function saveWMSAddress(productId){const f=$('#wms-address-form'),p=getProduct(productId);if(!f||!p)return;if(getInventoryLock('product',p.id)){toast('Produto pausado por contagem ativa no módulo Inventário.','error');return;}const d=formObject(f),qty=Number(d.quantity),location=wmsLocation(d.locationId);if(!location||location.active===false||!Number.isFinite(qty)||qty<=0){toast('Informe posição ativa e quantidade válida.','error');return;}const free=wmsCapacityFree(location.id),unlocated=wmsUnlocatedQty(p.id);if(qty>unlocated+0.0001){toast(`Saldo sem endereço insuficiente. Disponível: ${formatQuantity(unlocated)}.`, 'error');return;}if(qty>free+0.0001){toast(`Capacidade da posição insuficiente. Livre: ${formatQuantity(free)}.`, 'error');return;}wmsUpsertAllocation(p.id,location.id,qty);wmsRecordMovement(p.id,'',location.id,qty,'ENDEREÇAMENTO',String(d.reason||'Endereçamento WMS'));logAudit('wms',p.id,'endereçar',null,{locationId:location.id,quantity:qty},d.reason||'');closeDialog();await persist();renderApp();toast('Produto endereçado sem alterar o saldo total.','success');}
function wmsMoveForm(productId){const p=getProduct(productId);if(!p)return;if(getInventoryLock('product',p.id)){toast('Produto pausado por contagem ativa no módulo Inventário.','error');return;}const allocations=wmsProductAllocations(p.id);if(!allocations.length){toast('Produto sem posição de origem. Enderece o saldo primeiro.','warning');return;}const locs=(state.wmsLocations||[]).filter(l=>l.active!==false);openDialog('Mover produto entre posições',`${p.sku} · ${p.name}`,`<form id="wms-move-form" data-id="${p.id}"><div class="form-grid">${field('Posição de origem *','fromId',allocations[0].locationId,'select',{options:allocations.map(a=>({value:a.locationId,label:`${wmsLocationLabel(a.locationId)} · ${formatQuantity(a.quantity)} un`})),full:true})}${field('Posição de destino *','toId',locs.find(l=>!allocations.some(a=>a.locationId===l.id))?.id||locs[0]?.id||'','select',{options:locs.map(l=>({value:l.id,label:`${l.code} · ${l.name}`})),full:true})}${field('Quantidade *','quantity',String(allocations[0].quantity),'number',{min:'0.001',step:'0.001'})}${field('Motivo *','reason','','text',{placeholder:'Ex.: reposição do picking'})}</div></form>`,`<button class="btn" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="wms-move-save" data-id="${p.id}">Confirmar transferência</button>`);}
async function saveWMSMove(productId){const f=$('#wms-move-form'),p=getProduct(productId);if(!f||!p)return;if(getInventoryLock('product',p.id)){toast('Produto pausado por contagem ativa no módulo Inventário.','error');return;}const d=formObject(f),qty=Number(d.quantity),from=wmsLocation(d.fromId),to=wmsLocation(d.toId),allocation=(state.wmsAllocations||[]).find(a=>a.productId===p.id&&a.locationId===d.fromId);if(!from||!to||from.id===to.id||from.active===false||to.active===false||!allocation||!String(d.reason||'').trim()||!Number.isFinite(qty)||qty<=0){toast('Confira origem, destino, quantidade e motivo.','error');return;}if(qty>Number(allocation.quantity)+0.0001){toast(`Quantidade acima do saldo na origem (${formatQuantity(allocation.quantity)}).`,'error');return;}if(qty>wmsCapacityFree(to.id)+0.0001){toast('Capacidade livre insuficiente no destino.','error');return;}wmsUpsertAllocation(p.id,from.id,-qty);wmsUpsertAllocation(p.id,to.id,qty);wmsRecordMovement(p.id,from.id,to.id,qty,'TRANSFERÊNCIA INTERNA',d.reason);logAudit('wms',p.id,'mover', {from:from.id,quantity:qty},{to:to.id,quantity:qty},d.reason);closeDialog();await persist();renderApp();toast('Transferência WMS registrada.','success');}
function wmsCountForm(productId){const p=getProduct(productId);if(!p)return;const allocations=wmsProductAllocations(p.id);if(!allocations.length){toast('Enderece o produto antes de iniciar uma contagem por posição.','warning');return;}openDialog('Contagem física WMS',`${p.sku} · ${p.name}`,`<form id="wms-count-form" data-id="${p.id}"><div class="form-grid">${field('Posição *','locationId',allocations[0].locationId,'select',{options:allocations.map(a=>({value:a.locationId,label:`${wmsLocationLabel(a.locationId)} · esperado ${formatQuantity(a.quantity)}`})),full:true})}${field('Quantidade física contada *','counted',String(allocations[0].quantity),'number',{min:'0',step:'0.001'})}${field('Observação / divergência','reason','','text',{required:false,placeholder:'Conferência, avaria, sobra...'})}</div><div class="notice mt-16">A contagem será salva no histórico. Divergências não alteram silenciosamente o saldo geral; confira e regularize por processo autorizado.</div></form>`,`<button class="btn" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="wms-count-save" data-id="${p.id}">Registrar contagem</button>`);}
async function saveWMSCount(productId){const f=$('#wms-count-form'),p=getProduct(productId);if(!f||!p)return;const d=formObject(f),expected=Number((state.wmsAllocations||[]).find(a=>a.productId===p.id&&a.locationId===d.locationId)?.quantity||0),counted=Number(d.counted);if(!Number.isFinite(counted)||counted<0){toast('Informe uma quantidade contada válida.','error');return;}const diff=Math.round((counted-expected)*1000)/1000;wmsRecordMovement(p.id,d.locationId,d.locationId,counted,'CONTAGEM FÍSICA',`${String(d.reason||'Contagem WMS')} · esperado ${formatQuantity(expected)} · contado ${formatQuantity(counted)} · diferença ${formatQuantity(diff)}`);const entry=state.wmsMovements[0];entry.expected=expected;entry.counted=counted;entry.difference=diff;entry.type='CONTAGEM FÍSICA';logAudit('wms',p.id,'contagem',{expected},{counted,difference:diff},d.reason||'');closeDialog();await persist();renderApp();toast(diff===0?'Contagem sem divergência registrada.':`Contagem registrada com divergência de ${formatQuantity(diff)}. O saldo total não foi alterado.`,'success');}

async function saveWMSLocation(id=''){const f=$('#wms-location-form');if(!f)return;const d=formObject(f),old=id?wmsLocation(id):null;const code=String(d.code||'').trim().toUpperCase(),capacity=Number(d.capacity);if(!code||!String(d.name||'').trim()||!String(d.warehouse||'').trim()||!String(d.zone||'').trim()||!Number.isFinite(capacity)||capacity<=0){toast('Preencha código, descrição, armazém, zona e capacidade.','error');return;}if((state.wmsLocations||[]).some(l=>l.id!==id&&l.warehouse.toLowerCase()===String(d.warehouse).toLowerCase()&&l.code.toUpperCase()===code)){toast('Já existe uma posição com este código neste armazém.','error');return;}const used=wmsLocationQty(id);if(capacity<used){toast(`A capacidade não pode ser inferior ao saldo endereçado (${formatQuantity(used)}).`,'error');return;}const loc={...(old||{}),id:old?.id||uid('wloc'),code,name:String(d.name).trim(),warehouse:String(d.warehouse).trim(),zone:d.zone,aisle:String(d.aisle||'').trim(),rack:String(d.rack||'').trim(),shelf:String(d.shelf||'').trim(),bin:String(d.bin||'').trim(),capacity,active:old?old.active!==false:true,createdAt:old?.createdAt||new Date().toISOString()};if(old)state.wmsLocations[state.wmsLocations.findIndex(l=>l.id===id)]=loc;else state.wmsLocations.push(loc);logAudit('wms_location',loc.id,old?'editar':'criar',old,loc,'Posição de armazém');closeDialog();await persist();renderApp();toast('Posição salva.','success');}

function filteredFinanceTitles(){
 const active=state.titles.filter(t=>titleStatus(t)!=='Cancelado');
 const activeFinanceType=financeTab==='pagar'||financeTab==='receber'?financeTab:'all';
 return active.filter(t=>{
  const term=financeSearch.toLowerCase().trim();
  const typeOK=activeFinanceType==='all'||t.type===activeFinanceType;
  const statusOK=financeStatusFilter==='all'||titleStatus(t)===financeStatusFilter;
  let dateOK=true;
  if(financePeriodFilter!=='all'){
   const days=Number(financePeriodFilter)||30;
   const due=String(t.dueDate||'');
   dateOK=due>=relativeDate(-days)&&due<=relativeDate(days);
  }
  return typeOK&&statusOK&&dateOK&&(!term||`${t.description} ${partnerLabel(t.partnerId)} ${t.category||''}`.toLowerCase().includes(term));
 });
}

function renderReconciliation(){
 const pending=state.statements.filter(s=>!s.reconciled&&!s.ignored);const done=state.statements.filter(s=>s.reconciled).length;
 return `<div class="toolbar"><span class="small muted">${done} conciliados / ${pending.length} pendentes</span><span class="spacer"></span><button class="btn" data-action="statement-import">${icon('upload',14)} Importar OFX/CSV</button><button class="btn btn-primary" data-action="statement-manual">${icon('plus',14)} Lançar linha manual</button></div><div class="reconcile-grid"><div class="reconcile-column"><div class="card-head"><div><h3>Extrato bancário</h3><p>Linhas importadas do banco</p></div></div>${state.statements.length?state.statements.map(s=>{const suggestion=bestMatchForStatement(s);return `<div class="reconcile-row"><div class="reconcile-copy"><strong>${escapeHTML(s.description)}</strong><span>${fmtDate(s.date)} · ${escapeHTML(s.fitid||'Sem FITID')}</span><span class="${s.amount<0?'trend-down':'trend-up'}">${s.amount<0?'−':'+'}${money(Math.abs(s.amount))}</span></div>${s.reconciled?statusBadge('Conciliado'):s.ignored?statusBadge('Cancelado'):suggestion&&suggestion.score>=75?`<span class="score">${suggestion.score} pts</span>`:'<span class="badge badge-neutral">Pendente</span>'}<div class="row-actions">${s.reconciled&&hasPermission('finance','reconcile')?`<button class="btn btn-sm" data-action="statement-unmatch" data-id="${s.id}">Desfazer</button>`:!s.reconciled&&!s.ignored?`<button class="btn btn-sm" data-action="statement-match" data-id="${s.id}">Vincular</button><button class="icon-action" data-action="statement-ignore" data-id="${s.id}" title="Ignorar">${icon('close',14)}</button>`:''}</div></div>`;}).join(''):`<div class="empty-state">${icon('file',28)}<strong>Sem extrato importado</strong><span>Importe um arquivo OFX/CSV para começar a conciliação.</span></div>`}</div><div class="reconcile-column"><div class="card-head"><div><h3>Lançamentos do sistema</h3><p>Títulos e baixas disponíveis para vínculo</p></div></div>${state.titles.filter(t=>titleStatus(t)!=='Cancelado'&&t.payments?.some(p=>!p.reversedAt)).slice(0,12).map(t=>{const activePayments=t.payments.filter(p=>!p.reversedAt);const lastActive=activePayments.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];return `<div class="reconcile-row"><div class="reconcile-copy"><strong>${escapeHTML(t.description)}</strong><span>${escapeHTML(partnerLabel(t.partnerId))} · ${fmtDate(lastActive?.date)}</span><span class="amount">${money(activePayments.reduce((s,p)=>s+p.amount,0))}</span></div>${activePayments.some(p=>p.reconciled)?statusBadge('Conciliado'):'<span class="badge badge-neutral">Disponível</span>'}</div>`;}).join('')||`<div class="empty-state">${icon('wallet',28)}<strong>Sem baixas para conciliar</strong><span>Registre pagamentos e recebimentos antes de conciliar.</span></div>`}</div></div><div class="card-body"><div class="notice">Sugestão de correspondência: valor igual (+50), data até 3 dias (+25), descrição semelhante (+15), parceiro (+10). Uma sugestão nunca é conciliada automaticamente; a confirmação é manual. Com permissão de conciliação, o botão Desfazer libera uma linha/baixa para nova conferência e permite estorno posterior sem apagar o histórico.</div></div>`;
}
function bestMatchForStatement(statement){
 let best=null;for(const title of state.titles){if(title.status==='Cancelado')continue;for(const payment of (title.payments||[])){if(payment.reconciled||payment.reversedAt)continue;let score=0;if(Math.abs(Math.abs(statement.amount)-payment.amount)<=1)score+=50;if(Math.abs(dateDiffDays(statement.date,payment.date))<=3)score+=25;const a=slug(statement.description),b=slug(title.description);if(a&&b&&(a.includes(b)||b.includes(a)||a.split('-').some(part=>part.length>3&&b.includes(part))))score+=15;if(title.partnerId&&slug(statement.description).includes(slug(partnerLabel(title.partnerId)).split('-')[0]))score+=10;if(!best||score>best.score)best={title,payment,score};}}return best;
}

 const company=escapeHTML(companyName());win.document.open();win.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHTML(title)}</title><style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#111827;margin:22px;font-size:12px}h1{font-size:21px;margin:0 0 4px}h2{font-size:14px;margin:22px 0 8px}.meta{color:#475569;font-size:10px;margin:0 0 16px}.print-report-table{width:100%;border-collapse:collapse;margin:10px 0 20px;page-break-inside:auto}.print-report-table tr{page-break-inside:avoid;page-break-after:auto}.print-report-table th,.print-report-table td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left;font-size:10px;vertical-align:top;overflow-wrap:anywhere}.print-report-table th{background:#eef2f7}.print-total{font-size:14px;font-weight:bold}.warning{font-size:10px;color:#64748b;margin-top:20px}@page{size:auto;margin:12mm}@media screen{body{max-width:1100px;margin:28px auto}.print-controls{position:sticky;top:0;background:#fff;padding:10px 0;margin-bottom:16px;border-bottom:1px solid #ddd}.print-controls button{padding:8px 12px;border:1px solid #cbd5e1;background:white;border-radius:6px;cursor:pointer}}@media print{.print-controls{display:none}body{margin:0}}</style></head><body><div class="print-controls"><button onclick="window.print()">Imprimir / Salvar em PDF</button></div><h1>${company} — ${escapeHTML(title)}</h1><div class="meta">Gerado em ${escapeHTML(new Date().toLocaleString('pt-BR'))} · Relatório gerencial local</div>${bodyHTML}<div class="warning">Documento gerencial de apoio. Confira os registros antes de usar em processos contábeis ou fiscais.</div></body></html>`);win.document.close();return true;
}

function xmlEscape(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}
function excelXMLWorkbook(sheets){
 const sheetXml=sheets.map(sheet=>{const name=String(sheet.name||'Planilha').slice(0,31).replace(/[\\/?*\[\]:]/g,' ');const rows=[sheet.headers||[],...(sheet.rows||[])];const content=rows.map(row=>`<Row>${row.map(value=>{const isNum=typeof value==='number'&&Number.isFinite(value);return `<Cell><Data ss:Type="${isNum?'Number':'String'}">${xmlEscape(value)}</Data></Cell>`;}).join('')}</Row>`).join('');return `<Worksheet ss:Name="${xmlEscape(name)}"><Table>${content}</Table></Worksheet>`;}).join('');
 return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">${sheetXml}</Workbook>`;
}

function stockInFindProduct(raw){const code=String(raw||'').trim(),norm=code.toUpperCase().replace(/\s+/g,'');const digits=normalizeDoc(code);return state.products.find(p=>p.active!==false&&(String(p.sku||'').toUpperCase().replace(/\s+/g,'')===norm||(digits.length>=8&&normalizeDoc(p.ean||'')===digits)));}
function stockInAddProduct(product,quantity=1){if(!product||product.active===false)throw new Error('Produto não encontrado ou inativo.');const qty=Number(quantity);if(!Number.isFinite(qty)||qty<=0)throw new Error('A quantidade deve ser maior que zero.');const line=stockInCart.find(x=>x.productId===product.id);if(line)line.quantity=Math.round((Number(line.quantity)+qty)*1000)/1000;else stockInCart.push({productId:product.id,quantity:qty,unitCost:Number(product.cost)||0});}
function stockInAddByCode(raw){const input=$('#stockin-barcode-input');const code=String(raw||'').trim();if(input)input.value='';if(!code){toast('Bipe ou digite o SKU/EAN do produto.','info');focusStockInScanner();return;}const product=stockInFindProduct(code);if(!product){stockInPendingUnknownCode=code;stockInPendingUnknownSource='stockin';toast(`Código “${code}” não cadastrado. Abrindo cadastro do produto.`, 'error');productForm(null,false,/^\d{8,14}$/.test(code)?{ean:code}:{sku:code});return;}try{stockInAddProduct(product,1);state.stockInDraft=stockInCart.map(x=>({...x}));persist().then(()=>{renderApp();focusStockInScanner();});toast(`${product.name} adicionado à entrada.`, 'success');}catch(error){toast(error.message,'error');}}
function focusStockInScanner(){const input=$('#stockin-barcode-input');if(input){input.focus();input.select();}}
function stockInCartTotal(){return stockInCart.reduce((sum,line)=>sum+Math.round((Number(line.unitCost)||0)*(Number(line.quantity)||0)),0);}
function stockInCatalog(){const q=String(stockInSearch||'').toLowerCase().trim();const products=state.products.filter(p=>p.active!==false&&(!q||`${p.name} ${p.sku} ${p.ean||''} ${p.category||''}`.toLowerCase().includes(q))).slice(0,20);if(!products.length)return `<div class="empty-state">${icon('package',26)}<strong>Nenhum produto encontrado</strong><span>Cadastre o produto no Estoque antes de receber, se ele ainda não existir.</span><div class="mt-16"><button class="btn btn-primary" data-action="stockin-add-product">Cadastrar produto</button></div></div>`;return products.map(p=>`<button class="stockin-product" data-action="stockin-scan-add" data-id="${p.id}"><strong>${escapeHTML(p.name)}</strong><span>SKU ${escapeHTML(p.sku)} · EAN ${escapeHTML(p.ean||'—')}</span><span>Saldo: ${formatQuantity(p.quantity)} ${escapeHTML(p.unit||'UN')} · Custo ${money(p.cost)}</span></button>`).join('');}
function stockInCartHTML(){if(!stockInCart.length)return `<div class="empty-state">${icon('package',30)}<strong>Nenhum item recebido</strong><span>Bipe o código ou selecione produtos para começar.</span></div>`;return `<div class="card-body" style="padding-top:8px">${stockInCart.map(line=>{const p=getProduct(line.productId);if(!p)return '';return `<div class="stockin-cart-line"><div><div class="stockin-cart-name">${escapeHTML(p.name)}</div><div class="stockin-cart-meta">${escapeHTML(p.sku)} · saldo atual ${formatQuantity(p.quantity)} ${escapeHTML(p.unit||'UN')}</div></div><div><label class="tiny muted" for="stockin-qty-${p.id}">Quantidade</label><input id="stockin-qty-${p.id}" data-stockin-qty data-id="${p.id}" type="number" min="0.001" step="0.001" value="${Number(line.quantity)||1}"></div><div><label class="tiny muted" for="stockin-cost-${p.id}">Custo unitário (R$)</label><input id="stockin-cost-${p.id}" data-stockin-cost data-id="${p.id}" type="number" min="0" step="0.01" value="${moneyInputValue(line.unitCost)}"></div><div class="stockin-cart-total"><span id="stockin-line-sum-${p.id}">${money(Math.round((Number(line.unitCost)||0)*(Number(line.quantity)||0)))}</span><div class="stockin-controls"><button class="btn btn-sm" data-action="stockin-item-minus" data-id="${p.id}" aria-label="Diminuir quantidade">−</button><button class="btn btn-sm" data-action="stockin-item-plus" data-id="${p.id}" aria-label="Aumentar quantidade">+</button><button class="btn btn-sm btn-danger" data-action="stockin-item-remove" data-id="${p.id}">Remover</button></div></div></div>`;}).join('')}</div>`;}

function auditFilteredRows(){const term=($('#audit-search')?.value||'').toLowerCase().trim();return state.audit.filter(a=>!term||`${a.entity} ${a.action} ${a.userName||''} ${a.reason||''}`.toLowerCase().includes(term));}

 const content=`<p class="print-total">${rows.length} evento(s) de auditoria</p>${reportPrintTable(['Data','Usuário','Entidade','ID','Ação','Motivo / detalhe'],rows)}`;

function exportAuditExcel(){const rows=state.audit.map(a=>[a.date||'',a.userName||'',a.entity||'',a.entityId||'',a.action||'',a.reason||'',JSON.stringify(a.before||{}),JSON.stringify(a.after||{})]);const sheets=[{name:'Auditoria',headers:['Data','Usuário','Entidade','ID','Ação','Motivo','Antes JSON','Depois JSON'],rows}];downloadFile(`nexora-auditoria-${dateISO()}.xml`,excelXMLWorkbook(sheets),'application/vnd.ms-excel;charset=utf-8');toast('Auditoria exportada para Excel XML.','success');}

async function saveCollaborator(id){
 const form=$('#collaborator-form');if(!form)return;const d=formObject(form),old=id?state.authUsers.find(u=>u.id===id):null;
 const email=String(d.email||'').trim().toLowerCase(),name=String(d.name||'').trim();
 if(!name||!email||!/^\S+@\S+\.\S+$/.test(email)){toast('Informe nome e e-mail válido.','error');return;}
 if(state.authUsers.some(u=>u.email.toLowerCase()===email&&u.id!==id)){toast('Já existe um colaborador com este e-mail.','error');return;}
 if(!old&&(!d.password||d.password.length<8||!/[A-Za-zÀ-ÿ]/.test(d.password)||!/[0-9]/.test(d.password))){toast('A senha inicial deve ter 8 caracteres ou mais, com letra e número.','error');return;}
 if(d.password&& (d.password.length<8||!/[A-Za-zÀ-ÿ]/.test(d.password)||!/[0-9]/.test(d.password))){toast('A nova senha precisa ter 8 caracteres ou mais, com letra e número.','error');return;}
 if(old?.id==='user_demo'&&(d.role!=='Administrador'||d.active==='false')){toast('O administrador principal não pode perder o perfil ou ser inativado.','error');return;}
 if(old&&!hasPermission('users','deactivate')&&String(d.active)!==String(old.active!==false)){toast('Seu perfil não pode alterar o status deste colaborador.','error');return;}
 const canChangePermissions=hasPermission('users','permissions');
 const actor=getUser(),actorIsAdmin=isAdministrator(actor);
 const role=old?.id==='user_demo'?'Administrador':(canChangePermissions?(d.role||'Personalizado'):(old?.role||d.role||'Vendedor'));
 if(old&&isAdministrator(old)&&!actorIsAdmin){toast('Somente um administrador pode editar outro administrador.','error');return;}
 if(!actorIsAdmin&&['Administrador','Administrador local','Admin'].includes(role)){toast('Somente o administrador principal pode conceder perfil de administrador.','error');return;}
 const permissions=blankPermissions();
 if(canChangePermissions){for(const module of PERMISSION_MODULES)for(const action of module.actions){const box=$(`#perm_${module.key}_${action}`);permissions[module.key][action]=box?box.checked:false;}}
 else Object.assign(permissions,normalizePermissions(old?.permissions||null,role));
 if(actorIsAdmin&&isAdministrator({role}))Object.assign(permissions,defaultPermissionsForRole('Administrador'));
 // Delegação segura: um gestor não pode conceder mais direitos do que possui.
 if(!actorIsAdmin){for(const module of PERMISSION_MODULES)for(const action of module.actions){permissions[module.key][action]=permissions[module.key][action]===true&&hasPermission(module.key,action,actor);}}
 if(!Object.values(permissions).some(module=>module.view)){toast('Libere a visualização de pelo menos uma página que seu perfil possa conceder.','error');return;}
 const user={...(old||{}),id:old?.id||uid('user'),name,email,role,active:old?.id==='user_demo'?true:(old&&!hasPermission('users','deactivate')?(old.active!==false):d.active!=='false'),permissions,companyId:old?.companyId||state.meta.companyId||'company_demo',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
 if(d.password){user.passwordHash=await hashPassword(d.password);delete user.passwordPlainDemo;}
 else if(!user.passwordHash&&!user.passwordPlainDemo){toast('Defina uma senha para este colaborador.','error');return;}
 if(old){state.authUsers[state.authUsers.findIndex(u=>u.id===id)]=user;logAudit('colaborador',user.id,'editar',old,user,'Perfil e permissões atualizados');}else{state.authUsers.unshift(user);logAudit('colaborador',user.id,'criar',null,user,'Cadastro local de colaborador');addActivity('auth','Colaborador cadastrado',`${name} · ${role}`);}
 if(getUser().id===user.id)currentUser=user;
 closeDialog();await persist();renderApp();toast(old?'Colaborador atualizado.':'Colaborador criado.','success');
}
async function toggleCollaborator(id){
 if(!hasPermission('users','deactivate')){toast('Seu perfil não pode ativar ou inativar colaboradores.','error');return;}
 const user=state.authUsers.find(u=>u.id===id);if(!user)return;if(user.id==='user_demo'||user.id===getUser().id){toast('Não é permitido inativar o administrador principal ou a própria sessão.','error');return;}

}

async function saveBulkPayment(){
 const form=$('#bulk-payment-form');if(!form)return;const d=formObject(form),account=state.accounts.find(a=>a.id===d.accountId&&a.active);
 if(!d.date||!d.method||!account){toast('Informe data, forma de pagamento e conta financeira ativa.','error');return;}
 const targets=state.titles.filter(t=>selectedRows.has(t.id)&&titleStatus(t)!=='Cancelado'&&openAmount(t)>0);if(!targets.length){toast('Nenhum título selecionado permanece em aberto.','error');return;}
 if(new Set(targets.map(t=>t.type)).size>1){toast('A baixa em lote precisa conter apenas contas a pagar ou apenas contas a receber. Selecione um tipo por vez.','error');return;}
 if(targets.some(t=>!Number.isFinite(openAmount(t))||openAmount(t)<=0)){toast('Há títulos inválidos na seleção. Atualize a tabela e tente novamente.','error');return;}
 const beforeBalance=account.balance;let totalCash=0;
 for(const title of targets){const principal=openAmount(title);const before=clone(title);const payment={id:uid('pay'),date:d.date,amount:principal,interest:0,fine:0,discount:0,method:d.method,accountId:account.id,reconciled:false,createdAt:new Date().toISOString(),userId:getUser().id,bulk:true};title.payments=Array.isArray(title.payments)?title.payments:[];title.payments.push(payment);title.paid=(Number(title.paid)||0)+principal;title.status=openAmount(title)<=0?'Pago':'Parcial';totalCash+=title.type==='receber'?principal:-principal;logAudit('titulo',title.id,'baixa em lote',before,clone(title),`Baixa integral em lote por ${d.method}`);}
 account.balance+=totalCash;selectedRows.clear();logAudit('conta_bancaria',account.id,'baixa em lote',{balance:beforeBalance},{balance:account.balance},`${targets.length} títulos`);addActivity('finance','Baixa em lote registrada',`${targets.length} título(s) · ${money(Math.abs(totalCash))}`);closeDialog();await persist();renderApp();toast(`${targets.length} título(s) baixado(s); saldos atualizados.`, 'success');
}

function posLineSubtotal(line){return Math.round((Number(line.unitPrice)||0)*(Number(line.quantity)||0));}
function posSubtotal(){return posCart.reduce((sum,line)=>sum+posLineSubtotal(line),0);}
function posDiscountAmount(){return Math.min(posSubtotal(),Math.max(0,Math.round(posSubtotal()*(Math.min(100,Math.max(0,Number(posDiscountPercent)||0))/100))));}

function addPosProduct(productId,quantity=1){
 const p=getProduct(productId);if(!p||p.active===false)throw new Error('Produto não disponível para venda.');
 const lock=getInventoryLock('product',p.id);if(lock)throw new Error(`Produto pausado pelo inventário ${lock.session.number}; finalize a contagem antes de vender.`);
 const qty=Number(quantity);if(!Number.isFinite(qty)||qty<=0)throw new Error('Quantidade inválida.');
 const line=posCart.find(x=>x.productId===p.id);const nextQty=(Number(line?.quantity)||0)+qty;
 if(!state.settings.negativeStock&&nextQty>Number(p.quantity)+1e-6)throw new Error(`Estoque insuficiente para ${p.name}. Disponível: ${formatQuantity(p.quantity)} ${p.unit||'UN'}.`);
 if(line)line.quantity=Math.round(nextQty*1000)/1000;else posCart.push({id:uid('cart'),productId:p.id,quantity:Math.round(qty*1000)/1000,unitPrice:Number(p.price)||0});
 state.posDraft=posCart.map(x=>({...x}));addActivity('sale','Produto adicionado ao PDV',`${p.name} × ${formatQuantity(qty)}`);persist().then(()=>{if(currentPage==='sales'&&posTab==='checkout')renderApp();focusPosScanner();});
}

function updatePosPaymentForm(){

function validateNoteDraft(note){const errors=[];if(!(note.supplierId||note.supplierName))errors.push('Vincule um fornecedor cadastrado ou informe o nome.');if(!note.number)errors.push('Informe o número da nota.');if(note.key&&normalizeDoc(note.key).length!==44)errors.push('A chave de acesso deve conter 44 dígitos.');if(!note.items?.length)errors.push('A nota precisa ter ao menos um item.');if(note.items?.some(i=>!i.description||Number(i.quantity)<=0||Number(i.unitPrice)<0))errors.push('Cada item precisa de descrição, quantidade positiva e preço válido.');if(note.items?.some(i=>!i.productId))errors.push('Vincule todos os itens a produtos existentes antes de confirmar nesta edição.');const itemTotal=(note.items||[]).reduce((s,i)=>s+Math.round((Number(i.quantity)||0)*(Number(i.unitPrice)||0)),0);if(Math.abs(itemTotal-(Number(note.productsValue)||0))>5)errors.push('A soma dos itens diverge do total dos produtos por mais de R$ 0,05.');const expected=(Number(note.productsValue)||0)+(Number(note.freight)||0)+(Number(note.tax)||0)-(Number(note.discount)||0);if(Math.abs(expected-(Number(note.total)||0))>5)errors.push('O total não confere com produtos + frete + impostos − desconto.');if(note.key&&normalizeDoc(note.key).length===44&&!validateAccessKey(note.key))errors.push('O dígito verificador da chave de acesso não confere.');const same=state.notes.find(n=>n.id!==note.id&&(note.key&&n.key===note.key||(n.number===note.number&&n.series===note.series&&n.supplierId===note.supplierId)));if(same)errors.push('Possível duplicidade: existe uma nota com a mesma chave ou fornecedor/número/série.');return errors;}
function parseNFeXML(xmlText,fileName='nota.xml'){
 const parser=new DOMParser();const doc=parser.parseFromString(xmlText,'application/xml');if(doc.querySelector('parsererror'))throw new Error('O arquivo não é um XML válido.');
 const get=(selector,root=doc)=>root.getElementsByTagName(selector)[0]?.textContent?.trim()||'';
 const inf=doc.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Não foi encontrada a estrutura infNFe de uma NF-e.');
 const ide=doc.getElementsByTagName('ide')[0],emit=doc.getElementsByTagName('emit')[0],totalNode=doc.getElementsByTagName('ICMSTot')[0],dest=doc.getElementsByTagName('dest')[0];
 const items=Array.from(doc.getElementsByTagName('det')).map((det,i)=>{const prod=det.getElementsByTagName('prod')[0];const read=n=>prod?.getElementsByTagName(n)[0]?.textContent?.trim()||'';return{id:uid('item'),line:Number(det.getAttribute('nItem'))||i+1,code:read('cProd'),ean:read('cEAN'),description:read('xProd')||`Item ${i+1}`,ncm:read('NCM'),cfop:read('CFOP'),unit:read('uCom')||'UN',quantity:Number(read('qCom').replace(',','.'))||0,unitPrice:cents(read('vUnCom').replace(',','.')),total:cents(read('vProd').replace(',','.')),productId:(state.products.find(p=>String(p.sku||'').toLowerCase()===String(read('cProd')||'').toLowerCase()||(read('cEAN')&&normalizeDoc(p.ean)===normalizeDoc(read('cEAN'))))?.id)||''};});
 const productSum=items.reduce((s,i)=>s+i.total,0);const freight=cents(get('vFrete',totalNode)||0),tax=cents(get('vTotTrib',totalNode)||0),discount=cents(get('vDesc',totalNode)||0),value=cents(get('vNF',totalNode)||0);
 const access=inf.getAttribute('Id')?.replace(/^NFe/,'')||get('chNFe');const cnpj=normalizeCNPJ(get('CNPJ',emit));
 let supplier=state.partners.find(p=>p.supplier&&normalizePartnerDocument(p.document,p.type)===cnpj);let supplierName=get('xNome',emit);
 const issueRaw=get('dhEmi',ide)||get('dEmi',ide);let issueDate=dateISO();if(issueRaw){const d=issueRaw.slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d))issueDate=d;else if(/^\d{8}$/.test(d))issueDate=`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;}
 return{id:null,fileName,number:get('nNF',ide),series:get('serie',ide)||'1',issueDate,supplierId:supplier?.id||'',supplierName,key:access,productsValue:productSum,freight,tax,discount,total:value||productSum+freight+tax-discount,items,status:'Conferência',source:'XML',createdAt:new Date().toISOString(),recipientCnpj:normalizeCNPJ(get('CNPJ',dest))};
}

async function hashPassword(password){
 const salt=crypto.getRandomValues(new Uint8Array(16));
 if(crypto?.subtle){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},key,256);return `pbkdf2$150000$${Array.from(salt).map(b=>b.toString(16).padStart(2,'0')).join('')}$${Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('')}`;}
 return `local-demo$${btoa(unescape(encodeURIComponent(password)))}`;
}
async function verifyPassword(password,stored){
 if(!stored)return false;const parts=stored.split('$');if(parts[0]==='pbkdf2'&&crypto?.subtle){const iterations=Number(parts[1]);const salt=new Uint8Array(parts[2].match(/.{2}/g).map(x=>parseInt(x,16)));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},key,256);const result=Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');return result===parts[3];}if(parts[0]==='local-demo')return decodeURIComponent(escape(atob(parts.slice(1).join('$'))))===password;return false;
}

async function fetchJsonTimeout(url,timeout=10000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);try{const response=await fetch(url,{method:'GET',headers:{Accept:'application/json'},signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error(`Serviço retornou HTTP ${response.status}.`);return await response.json();}finally{clearTimeout(timer);}}

function doRestoreBackup(file){const reader=new FileReader();reader.onload=()=>{try{const raw=String(reader.result||'');let data;if(/<script\s+id=["']nexora-backup-data["']\s+type=["']application\/json["']\s*>/i.test(raw)){const match=raw.match(/<script\s+id=["']nexora-backup-data["']\s+type=["']application\/json["']\s*>([\s\S]*?)<\/script>/i);if(!match)throw new Error('Não foi possível localizar os dados incorporados no arquivo HTML.');data=JSON.parse(match[1]);}else{data=JSON.parse(raw);}const candidate=data.data||data;if(!candidate.products||!candidate.partners||!candidate.titles||!candidate.settings)throw new Error('O arquivo não parece ser um backup Nexora válido.');const company=candidate.settings.tradeName||candidate.settings.companyName||data.company||'Empresa não identificada';const exported=data.exportedAt?new Date(data.exportedAt).toLocaleString('pt-BR'):'Data não informada';openDialog('Confirmar restauração do backup',`Empresa: ${escapeHTML(company)} · Exportado em: ${escapeHTML(exported)}`,`<div class="notice danger">A restauração substituirá os dados atuais deste Nexora ERP. Recomendamos exportar um backup do estado atual antes de continuar.</div><p>Arquivo: <strong>${escapeHTML(file.name)}</strong></p><div class="grid grid-3"><div class="summary-item">Produtos<strong>${candidate.products.length}</strong></div><div class="summary-item">Parceiros<strong>${candidate.partners.length}</strong></div><div class="summary-item">Títulos<strong>${candidate.titles.length}</strong></div></div><p class="small muted">O arquivo será validado antes da substituição. Após restaurar, será necessário entrar novamente com um usuário presente no backup.</p>`,`<button class="btn" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="restore-backup-confirm">Restaurar dados deste arquivo</button>`);window.__pendingRestore=clone(candidate);}catch(error){toast(`Backup inválido: ${error.message}`,'error');}};reader.onerror=()=>toast('Não foi possível ler o arquivo.','error');reader.readAsText(file);}
function importStatementFile(file){if(file.size>CONFIG.maxUploadBytes){toast('Arquivo excede 10 MB.','error');return;}const reader=new FileReader();reader.onload=()=>{try{let lines=[],fitidSet=new Set(state.statements.map(s=>s.fitid).filter(Boolean));const text=String(reader.result||'');if(/\.ofx$|\.qfx$/i.test(file.name)||text.includes('<OFX>')||text.includes('<OFX')){
  const blocks=text.match(/<STMTTRN>[\s\S]*?<\/STMTTRN>/gi)||[];blocks.forEach((block,i)=>{const val=tag=>block.match(new RegExp(`<${tag}>([^\\r\\n<]+)`,'i'))?.[1]?.trim()||'';const rawDate=val('DTPOSTED').slice(0,8);const date=rawDate.length===8?`${rawDate.slice(0,4)}-${rawDate.slice(4,6)}-${rawDate.slice(6,8)}`:dateISO();const fitid=val('FITID');if(fitid&&fitidSet.has(fitid))return;const amount=Number(val('TRNAMT').replace(',','.'));if(!Number.isFinite(amount))return;lines.push({id:uid('st'),date,description:val('NAME')||val('MEMO')||'Movimento OFX',document:val('REFNUM'),fitid,amount:cents(amount),reconciled:false,ignored:false,source:file.name});if(fitid)fitidSet.add(fitid);});
 }else{const rows=parseCSV(text);rows.forEach((r,i)=>{const value=(...keys)=>{for(const k of keys)if(r[k]!==undefined&&r[k]!=='')return r[k];return'';};const dateRaw=value('data','date','dtposted','data-lancamento');let date=dateISO();if(/^\d{2}\/\d{2}\/\d{4}$/.test(dateRaw))date=`${dateRaw.slice(6)}-${dateRaw.slice(3,5)}-${dateRaw.slice(0,2)}`;else if(/^\d{4}-\d{2}-\d{2}$/.test(dateRaw))date=dateRaw;const description=value('descricao','description','memo','historico','nome');const raw=String(value('valor','amount','value')).replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');const amount=Number(raw);const fitid=value('fitid','id','documento');if(!description||!Number.isFinite(amount))return;if(fitid&&fitidSet.has(fitid))return;lines.push({id:uid('st'),date,description,document:value('documento','doc'),fitid,amount:cents(amount),reconciled:false,ignored:false,source:file.name});if(fitid)fitidSet.add(fitid);});}

function matchStatement(id){const s=state.statements.find(x=>x.id===id);if(!s)return;const suggestions=[];state.titles.forEach(t=>(t.payments||[]).forEach(p=>{if(p.reconciled||p.reversedAt)return;let score=0;if(Math.abs(Math.abs(s.amount)-p.amount)<=1)score+=50;if(Math.abs(dateDiffDays(s.date,p.date))<=3)score+=25;const a=slug(s.description),b=slug(t.description);if(a&&b&&(a.includes(b)||b.includes(a)||a.split('-').some(x=>x.length>3&&b.includes(x))))score+=15;if(t.partnerId&&a.includes(slug(partnerLabel(t.partnerId)).split('-')[0]))score+=10;suggestions.push({t,p,score});}));suggestions.sort((a,b)=>b.score-a.score);const top=suggestions.slice(0,8);if(!top.length){toast('Não há baixas disponíveis para sugerir.','info');return;}openDialog('Vincular linha do extrato',`${s.description} · ${money(Math.abs(s.amount))}`,`<div class="notice mb-16">Escolha o título/baixa correspondente. A sugestão é apenas um apoio; confira manualmente antes de conciliar.</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Baixa disponível</th><th>Data</th><th>Valor</th><th>Score</th><th></th></tr></thead><tbody>${top.map((m,i)=>`<tr><td><strong>${escapeHTML(m.t.description)}</strong><div class="table-secondary">${escapeHTML(partnerLabel(m.t.partnerId))}</div></td><td>${fmtDate(m.p.date)}</td><td class="amount">${money(m.p.amount)}</td><td>${m.score>=75?`<span class="score">${m.score} pts · Sugerido</span>`:`${m.score} pts`}</td><td><button class="btn btn-sm ${m.score>=75?'btn-primary':''}" data-action="statement-confirm-match" data-statement="${s.id}" data-title="${m.t.id}" data-payment="${m.p.id}">Conciliar</button></td></tr>`).join('')}</tbody></table></div>`,`<button class="btn" data-action="modal-close">Cancelar</button>`,true);}
function confirmStatementMatch(statementId,titleId,paymentId){const s=state.statements.find(x=>x.id===statementId),t=getTitle(titleId),p=t?.payments?.find(x=>x.id===paymentId);if(!s||!t||!p)return;if(s.reconciled||s.ignored||p.reconciled||p.reversedAt||titleStatus(t)==='Cancelado'){toast('A linha ou a baixa não está mais disponível para conciliação. Atualize a tela.','error');return;}const before=clone(s);s.reconciled=true;s.reconciledAt=new Date().toISOString();s.matchedTitleId=t.id;s.matchedPaymentId=p.id;p.reconciled=true;p.reconciledStatementId=s.id;state.reconciliations.unshift({id:uid('rec'),statementId:s.id,titleId:t.id,paymentId:p.id,createdAt:new Date().toISOString(),userId:getUser().id});logAudit('conciliacao',s.id,'conciliar',before,s,`Vinculado a ${t.description}`);closeDialog();persist().then(()=>{renderApp();toast('Conciliação confirmada.','success');});}
function unmatchStatement(statementId){if(!hasPermission('finance','reconcile')){toast('Seu perfil não pode desfazer conciliações.','error');return;}const s=state.statements.find(x=>x.id===statementId);if(!s||!s.reconciled)return;openDialog('Desfazer conciliação bancária',`${s.description} · ${money(Math.abs(s.amount))}`,`<p>O vínculo com a baixa financeira será removido. O extrato e a baixa serão preservados para nova conferência.</p><div class="notice warning">Essa ação não apaga pagamentos, nem altera o saldo da conta; ela apenas libera a baixa para estorno ou novo vínculo.</div>`,`<button class="btn" data-action="modal-close">Voltar</button><button class="btn btn-danger" data-action="statement-unmatch-confirm" data-id="${s.id}">Desfazer conciliação</button>`);}

function getOperationalNotifications(){
 const list=[];const today=dateISO();
 for(const p of state.products.filter(p=>p.active!==false)){
  if(p.expiryDate){const exp=String(p.expiryDate).slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(exp)){const days=Math.round((Date.parse(exp+'T12:00:00')-Date.parse(today+'T12:00:00'))/86400000);if(days<0)list.push({id:`expiry:${p.id}:${exp}`,kind:'danger',title:`Produto vencido: ${p.name}`,message:`Lote ${p.lot||'não informado'} · venceu há ${Math.abs(days)} dia(s) (${fmtDate(exp)}).`,tag:'Vencido'});else if(days<=30)list.push({id:`expiry:${p.id}:${exp}`,kind:days<=7?'danger':'warning',title:`Validade próxima: ${p.name}`,message:`Lote ${p.lot||'não informado'} · ${days===0?'vence hoje':`vence em ${days} dia(s)`} (${fmtDate(exp)}).`,tag:days===0?'Vence hoje':'Até 30 dias'});}}
  if(Number(p.quantity)<=Number(p.min))list.push({id:`stock-low:${p.id}`,kind:'warning',title:`Estoque baixo: ${p.name}`,message:`Saldo ${formatQuantity(p.quantity)} · mínimo ${formatQuantity(p.min)}.`,tag:'Estoque baixo'});
 }
 for(const t of state.titles.filter(t=>titleStatus(t)==='Vencido'))list.push({id:`title-overdue:${t.id}:${t.dueDate}`,kind:'danger',title:`Título vencido: ${t.description}`,message:`${partnerLabel(t.partnerId)} · vencimento ${fmtDate(t.dueDate)} · aberto ${money(openAmount(t))}.`,tag:'Financeiro'});
 const activeIds=new Set(list.map(item=>item.id));state.alertDismissals=Array.isArray(state.alertDismissals)?state.alertDismissals.filter(id=>activeIds.has(id)):[];const dismissed=new Set(state.alertDismissals);const visible=list.filter(item=>!dismissed.has(item.id));const visibleIds=new Set(visible.map(item=>item.id));state.alertReadIds=Array.isArray(state.alertReadIds)?state.alertReadIds.filter(id=>visibleIds.has(id)):[];return visible;
}

async function setOperationalNotificationRead(id,read=true){const notification=getOperationalNotifications().find(n=>n.id===id);if(!notification)return;state.alertReadIds=Array.isArray(state.alertReadIds)?state.alertReadIds:[];const before=state.alertReadIds.includes(id);if(read&&!before)state.alertReadIds.push(id);if(!read)state.alertReadIds=state.alertReadIds.filter(x=>x!==id);logAudit('notificacao',id,read?'marcar como lida':'marcar como não lida',{read:before},{read},notification.title);await persist();renderApp();showAlerts();toast(read?'Notificação marcada como lida.':'Notificação marcada como não lida.','success');}

function GenCopy(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Referência copiada.','success')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast('Referência copiada.','success');}


async function processProductImage(file){
 if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)){toast('A imagem deve ser JPG ou PNG.','error');return;}if(file.size>5*1024*1024){toast('A imagem original deve ter até 5 MB.','error');return;}
 try{
  const source=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.readAsDataURL(file);});
  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('O arquivo selecionado não é uma imagem válida.'));img.src=source;});
  const maxSide=1000,scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));if(!blob)throw new Error('Não foi possível otimizar a imagem.');
  productImageDraft=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('Falha ao preparar a imagem.'));r.readAsDataURL(blob);});
  const preview=$('#product-image-preview');if(preview)preview.innerHTML=`<img src="${escapeHTML(productImageDraft)}" alt="Prévia do produto">`;const btn=$('#product-image-remove');if(btn)btn.hidden=false;toast('Imagem otimizada e anexada ao formulário.','success');
 }catch(error){toast(error.message||'Não foi possível processar a imagem.','error');}
}
function applyFieldMask(input){
 const mask=input.dataset.mask;if(!mask)return;let v=String(input.value||'');
 if(mask==='sku'){input.value=v.toUpperCase().replace(/[^A-Z0-9._/-]/g,'').slice(0,40);return;}
 if(mask==='ean'){input.value=v.replace(/\D/g,'').slice(0,14);return;}
 if(mask==='ncm'){input.value=v.replace(/\D/g,'').slice(0,8);return;}
 if(mask==='cep'){const d=v.replace(/\D/g,'').slice(0,8);input.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d;return;}
 if(mask==='phone'){const d=v.replace(/\D/g,'').slice(0,11);input.value=d.length<=2?d:d.length<=6?`(${d.slice(0,2)}) ${d.slice(2)}`:d.length<=10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;return;}
 if(mask==='document'){
  const type=$('#partner-type')?.value||'PF';if(type==='PF'){const d=v.replace(/\D/g,'').slice(0,11);input.value=d.length<=3?d:d.length<=6?`${d.slice(0,3)}.${d.slice(3)}`:d.length<=9?`${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`:`${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;}
  else{const n=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,14);if(/^[0-9]*$/.test(n)){input.value=n.length<=2?n:n.length<=5?`${n.slice(0,2)}.${n.slice(2)}`:n.length<=8?`${n.slice(0,2)}.${n.slice(2,5)}.${n.slice(5)}`:n.length<=12?`${n.slice(0,2)}.${n.slice(2,5)}.${n.slice(5,8)}/${n.slice(8)}`:`${n.slice(0,2)}.${n.slice(2,5)}.${n.slice(5,8)}/${n.slice(8,12)}-${n.slice(12)}`;}else input.value=n;}
 }
}
